name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing Git tag to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      BINARY_NAME: ccg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve Tag and Version
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [[ -z "${TAG}" ]]; then
              echo "workflow_dispatch requires 'tag' input"
              exit 1
            fi
          fi

          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Validate Tag Exists
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/${{ steps.vars.outputs.tag }}" >/dev/null; then
            echo "Tag not found: ${{ steps.vars.outputs.tag }}"
            exit 1
          fi

      - name: Checkout Tag Commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/${{ steps.vars.outputs.tag }}"

      - name: Run Tests
        run: go test ./...

      - name: Build binaries and archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="${{ steps.vars.outputs.version }}"
          for OS in darwin linux; do
            for ARCH in arm64 amd64; do
              STAGING_DIR="dist/ccgateway_${VERSION}_${OS}_${ARCH}"
              ARCHIVE_PATH="${STAGING_DIR}.tar.gz"
              mkdir -p "${STAGING_DIR}"

              GOOS="${OS}" GOARCH="${ARCH}" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w" -o "${STAGING_DIR}/${BINARY_NAME}" ./cmd/ccg

              chmod +x "${STAGING_DIR}/${BINARY_NAME}"
              tar -czf "${ARCHIVE_PATH}" -C "${STAGING_DIR}" "${BINARY_NAME}"
              rm -rf "${STAGING_DIR}"
            done
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/*.tar.gz > dist/checksums.txt
          cat dist/checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
